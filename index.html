<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!--
      ?v=3 — обновлённый бренд. Параметр обязателен: фавиконы браузеры кэшируют
      агрессивно и без смены URL продолжали бы показывать прежний логотип.
      apple-touch-icon отдельный: iOS подставляет свой фон под прозрачность,
      поэтому у него непрозрачная тёмная плитка.
    -->
    <link rel="icon" type="image/png" href="/favicon.png?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0A" />
    <title>Coolay Studio — AI-генерация карточек товаров</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--
      SDK Telegram Mini App. Подключается синхронно в <head>-порядке до main.ts:
      компонент /tg читает window.Telegram.WebApp.initData сразу в onMounted,
      и при отложенной загрузке объекта там ещё не было бы — приложение решило
      бы, что открыто вне Telegram, и отказало бы в доступе.
      Скрипт крошечный (~10 КБ) и на остальных страницах просто не используется.
    -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
